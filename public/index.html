<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#10131a" />
    <title>AI Image Studio</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <header>
        <h1>AI Image Studio</h1>
        <p>
          Upload a photo, apply instant AI-inspired enhancements, or send a custom
          prompt for full AI image editing.
        </p>
      </header>

      <section class="controls">
        <label class="upload">
          <span>Upload image</span>
          <input id="imageInput" type="file" accept="image/*" capture="environment" />
        </label>

        <div class="tool-grid">
          <button id="enhanceBtn" type="button">Auto Enhance</button>
          <button id="denoiseBtn" type="button">Denoise & Smooth</button>
          <button id="dramaticBtn" type="button">Dramatic Relight</button>
          <button id="resetBtn" type="button" class="secondary">Reset</button>
        </div>

        <label for="promptInput">AI prompt edit</label>
        <textarea
          id="promptInput"
          rows="4"
          placeholder="Example: Remove background and add a cinematic neon city at night."
        ></textarea>

        <button id="aiEditBtn" type="button" class="primary">Generate AI Edit</button>
        <p id="status" role="status"></p>
      </section>

      <section class="canvas-wrap">
        <canvas id="editorCanvas" width="1024" height="1024"></canvas>
      </section>

      <footer>
        <button id="downloadBtn" type="button" class="secondary">Download PNG</button>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
</html>
